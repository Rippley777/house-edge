name: Deploy existing Azure F1 application
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Unique even when the same commit is redeployed. Next.js reloads stale clients.
      NEXT_DEPLOYMENT_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      VITE_HOUSE_EDGE_PROJECT: ${{ vars.VITE_HOUSE_EDGE_PROJECT }}
      VITE_HOUSE_EDGE_KEY: ${{ vars.VITE_HOUSE_EDGE_KEY }}
      VITE_HOUSE_EDGE_ENDPOINT: ${{ vars.VITE_HOUSE_EDGE_ENDPOINT }}
      NEXT_PUBLIC_HOUSE_EDGE_PROJECT: ${{ vars.NEXT_PUBLIC_HOUSE_EDGE_PROJECT }}
      NEXT_PUBLIC_HOUSE_EDGE_KEY: ${{ vars.NEXT_PUBLIC_HOUSE_EDGE_KEY }}
      NEXT_PUBLIC_HOUSE_EDGE_ENDPOINT: ${{ vars.NEXT_PUBLIC_HOUSE_EDGE_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build production application
        run: npm run build
      - name: Package Linux runtime without local data or credentials
        run: |
          python3 scripts/package-azure-ci.py
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Code deployment only: this workflow cannot create or upgrade a plan.
      - uses: azure/webapps-deploy@v3
        with:
          app-name: house-edge-daac2bd8
          package: ${{ runner.temp }}/azure-app.zip
          type: zip
          clean: 'true'
          restart: 'true'
      - name: Verify deployed application
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://house-edge-daac2bd8.azurewebsites.net/login?deployment=$NEXT_DEPLOYMENT_ID" \
              -o "$RUNNER_TEMP/azure-smoke" && \
              grep -Fq "data-dpl-id=\"$NEXT_DEPLOYMENT_ID\"" "$RUNNER_TEMP/azure-smoke"; then
              echo "Verified running deployment: $NEXT_DEPLOYMENT_ID"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Azure did not serve deployment $NEXT_DEPLOYMENT_ID. Check the package mount and App Service restart logs."
          exit 1
